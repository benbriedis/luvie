# Build, package and publish a Luvie release.
#
# Triggered by pushing a version tag. Produces a *draft* GitHub release so the artifacts
# can be checked before anyone can download them; publishing is a manual click.
#
#     git tag -a v0.1.0 -m "Luvie 0.1.0" && git push origin v0.1.0
#
# See NOTES/RELEASING.txt for the full procedure and the optional signing secrets.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:          # for a dry run: builds and uploads, publishes nothing

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported distribution. The GCC runtime is linked
          # statically, so glibc is the remaining library the binaries take from the
          # host, and it is the build host that sets that floor for every Linux
          # artifact produced here.
          - name: Linux
            os: ubuntu-22.04
            preset: linux-dist
          - name: macOS
            os: macos-14
            preset: macos-dist
          - name: Windows
            os: windows-latest
            preset: windows-dist

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # version strings come from `git describe --tags`

      # ---- Toolchain (kept in step with ci.yml) ----------------------------------
      - name: Install Linux dependencies
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          # `rpm` is packaging-only (it provides rpmbuild, which CPack's RPM generator
          # shells out to) — hence its absence from ci.yml, which does not package.
          sudo apt-get install -y --no-install-recommends \
            g++-13 ninja-build pkg-config xvfb rpm \
            libasound2-dev \
            libx11-dev libxkbcommon-dev libxinerama-dev libxcursor-dev libxfixes-dev \
            libxft-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev libdbus-1-dev \
            libgtk-3-dev
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: matrix.name == 'macOS'
        shell: bash
        run: brew install ninja

      - name: Set up MSYS2
        if: matrix.name == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build-dist/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}

      # ---- Build and test --------------------------------------------------------
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (Linux)
        if: matrix.name == 'Linux'
        shell: bash
        run: xvfb-run -a ctest --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.name != 'Linux'
        run: ctest --preset ${{ matrix.preset }}

      # ---- Package ---------------------------------------------------------------
      # cmake/Packaging.cmake already selects each platform's generators (DEB and RPM
      # here), so plain `cpack` is enough.
      #
      # The RPM generator is added only when rpmbuild is present, so that a developer
      # without it still gets the .deb. In CI its absence would instead mean silently
      # shipping one artifact fewer, so check for the file rather than trusting the run to
      # have installed everything.
      - name: Package (Linux)
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          set -eu
          (cd build-dist && cpack)
          for ext in deb rpm; do
            if ! compgen -G "build-dist/*.$ext" > /dev/null; then
              echo "::error::cpack produced no .$ext"
              exit 1
            fi
          done

      # macOS packaging stages, signs and archives in one script, because the order is
      # load-bearing — see the comments in the script. Signing activates only when the
      # secrets exist, so a fork or an unconfigured repo still produces a usable
      # (unsigned) zip rather than failing.
      - name: Import macOS signing certificate
        if: matrix.name == 'macOS'
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "MACOS_CERT_P12 not set — this build will be unsigned"
            exit 0
          fi
          # A throwaway keychain, unlocked for this job only, so the certificate never
          # touches the runner's login keychain.
          KEYCHAIN="$RUNNER_TEMP/luvie-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # Without this, codesign blocks on an interactive keychain-access prompt.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: matrix.name == 'macOS'
        shell: bash
        env:
          # Notarization is a separate opt-in from signing: it needs an Apple ID and an
          # app-specific password, which not every signing setup has to hand.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            xcrun notarytool store-credentials luvie-notary \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD"
            export MACOS_NOTARY_PROFILE=luvie-notary
          fi
          tools/make-macos-dmg.sh build-dist

      # Signing the payload has to happen before packaging, so both the archive and the
      # installer contain signed binaries; unlike macOS there is nothing to stage first, as
      # signtool works on the built files in place. The installer itself is signed further
      # down, once it exists. tools/sign-windows.ps1 does nothing when no certificate is
      # configured, so an unsigned but perfectly functional build still comes out (users
      # see a SmartScreen warning).
      - name: Sign Windows binaries
        if: matrix.name == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_P12: ${{ secrets.WINDOWS_CERT_P12 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          ./tools/sign-windows.ps1 `
            build-dist/src/luvie.exe `
            build-dist/luvie.lv2/luvie_dsp.dll `
            build-dist/luvie.lv2/luvie_ui.dll

      - name: Package (Windows)
        if: matrix.name == 'Windows'
        run: |
          # The zip and the installer must be self-contained: the dist preset links the GCC
          # runtime statically precisely so no MSYS2 DLL has to ship. Catch a regression
          # here rather than in a bug report from someone without MSYS2 installed.
          if ldd build-dist/src/luvie.exe | grep -iE 'msys|ucrt64/bin'; then
            echo "::error::luvie.exe depends on MSYS2 DLLs; the static link flags are not taking effect"
            exit 1
          fi
          (cd build-dist && cpack)
          # Both are published, and they are not redundant. The installer places the plug-in
          # in %APPDATA%\LV2, adds a Start menu entry, registers .luv and can uninstall
          # itself. The zip is the download that always works: browsers block unsigned .exe
          # downloads far more readily than .zip ones.
          tools/make-windows-installer.sh build-dist

      # Now that setup.exe exists, sign that too. It is the file users actually execute, so
      # it is where a signature does the most good.
      - name: Sign Windows installer
        if: matrix.name == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_P12: ${{ secrets.WINDOWS_CERT_P12 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./tools/sign-windows.ps1 build-dist/*-setup.exe

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build-dist/*.zip
            build-dist/*-setup.exe
            build-dist/*.dmg
            build-dist/*.deb
            build-dist/*.rpm

  # ---- Install tests -----------------------------------------------------------------
  # Everything above builds and tests Luvie on the build host. These two jobs install the
  # finished packages the way a user would, on the distributions they target, and check
  # the result works. That catches the class of bug a build-tree test cannot see: a
  # missing dependency the build host happened to have, a file in the wrong prefix, an
  # LV2 bundle a host cannot find. The checks themselves live in tools/test-installed.sh,
  # shared by all three package formats and runnable by hand.
  test-packages:
    name: Install test (${{ matrix.name }})
    needs: package
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      # jackd keeps its buffers in /dev/shm, and Docker's 64 MB default is too small for
      # the server to start.
      options: --shm-size=512m
    strategy:
      fail-fast: false        # which distributions fail is the interesting part
      matrix:
        include:
          # Two .deb targets because they differ where it matters: bookworm is close to
          # the Ubuntu 22.04 build host, noble is past the 64-bit-time_t library renames,
          # so it exercises whether the package's dependencies still resolve.
          - name: Debian 12
            image: debian:12
            format: deb
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            format: deb
          # Unpinned: an old Fedora tag stops being installable the moment its repos are
          # retired, and a package-install test that cannot install anything is worse
          # than one that drifts forward.
          - name: Fedora
            image: fedora:latest
            format: rpm

    steps:
      # Before checkout, which needs git in the container.
      - name: Install test dependencies (Debian/Ubuntu)
        if: matrix.format == 'deb'
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          # Ubuntu's container image configures dpkg to throw away /usr/share/doc as it
          # unpacks, which a real installation does not do -- and that is where the
          # licence files Apache-2.0 requires us to ship end up. Restore normal
          # behaviour, or the test would check a system no user has.
          rm -f /etc/dpkg/dpkg.cfg.d/excludes
          apt-get update
          # xauth: xvfb-run uses it, and it is only a Recommends of xvfb.
          # lilv-utils: lv2ls, for the plugin-discovery check.
          apt-get install -y --no-install-recommends \
            ca-certificates git xvfb xauth jalv jackd2 lilv-utils

      - name: Install test dependencies (Fedora)
        if: matrix.format == 'rpm'
        run: |
          set -eux
          # lilv supplies lv2ls (the plugin-discovery check) and jack-tools supplies
          # jack_wait; on Debian those live in lilv-utils and jackd2 respectively.
          dnf -y install git xorg-x11-server-Xvfb xorg-x11-xauth jalv \
            jack-audio-connection-kit jack-tools lilv

      - uses: actions/checkout@v7
        # Only tools/test-installed.sh is wanted here; the packages come from the build
        # job, so there is nothing to version and no need for the tags.

      - uses: actions/download-artifact@v8
        with:
          name: packages-Linux
          path: packages

      # Installing through the package manager rather than `dpkg -i` / `rpm -i` is the
      # point: it resolves the package's declared dependencies, so a dependency the
      # package failed to declare surfaces as an unresolved library in the next step.
      - name: Install the package
        run: |
          set -eux
          if [ "${{ matrix.format }}" = deb ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./packages/luvie_*.deb
          else
            # tsflags= undoes the image's nodocs setting, for the same reason the
            # Debian step drops dpkg's excludes file.
            dnf -y --setopt=tsflags= install ./packages/luvie-*.rpm
          fi

      - name: Test the installed package
        env:
          # On a tag build, the tag must have reached the binary. Empty otherwise: a
          # dispatch run has no tag to check against.
          LUVIE_EXPECT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: tools/test-installed.sh

  # Arch gets no artifact from this workflow -- the AUR ships a PKGBUILD that each user's
  # makepkg compiles locally -- so the thing to test is the recipe. This builds it exactly
  # as a user would and then installs and runs the result, which is otherwise only ever
  # checked by hand at release time (see packaging/aur/README).
  test-aur-package:
    name: Install test (Arch, AUR PKGBUILD)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --shm-size=512m
    steps:
      - name: Install build and test dependencies
        run: |
          set -eux
          # lilv-tools, not lilv: Arch splits lv2ls and friends out of the library
          # package, and without them the plugin-discovery check silently skips itself.
          pacman -Syu --noconfirm --needed git namcap sudo \
            jalv jack2 lilv-tools xorg-server-xvfb xorg-xauth
          # makepkg refuses to run as root, and --syncdeps needs sudo to install
          # the PKGBUILD's own dependencies.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v7

      - name: Build with makepkg
        run: |
          set -eux
          cp packaging/aur/PKGBUILD /home/builder/
          # The PKGBUILD builds from the git tag named by pkgver, and that field is
          # bumped by hand only *after* a release goes out (packaging/aur/README). Point
          # it at the tag being released so this tests the code in hand; on a dispatch
          # run there is no tag, so it stays as written and re-tests the last release.
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" /home/builder/PKGBUILD
          fi
          chown -R builder /home/builder
          # -s installs depends, makedepends and checkdepends; the PKGBUILD's own check()
          # runs the build-tree smoke test under xvfb before packaging.
          sudo -u builder --login makepkg --syncdeps --noconfirm

      - name: Lint with namcap
        # Advisory: namcap flags conventions, not breakage, and its warnings should not
        # hold up a release.
        continue-on-error: true
        run: |
          namcap /home/builder/PKGBUILD
          namcap /home/builder/luvie-[0-9]*.pkg.tar.zst

      - name: Install the built package
        run: |
          set -eux
          # Arch's container image, like Debian's and Fedora's, keeps itself small by
          # discarding documentation as it unpacks -- here through NoExtract, which would
          # silently drop the licence files this package is required to ship. Only now,
          # so the dependency installs above stayed lean.
          sed -i '/^NoExtract/d' /etc/pacman.conf
          # luvie-*, not luvie-*-debug: stock makepkg.conf has `debug` in OPTIONS, so
          # every build also produces a detached-symbols package. It is not what an AUR
          # user installs to run Luvie, and it is 80 MB.
          pacman -U --noconfirm /home/builder/luvie-[0-9]*.pkg.tar.zst

      - name: Test the installed package
        env:
          LUVIE_EXPECT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: tools/test-installed.sh

  release:
    name: Draft GitHub release
    # The install tests gate the draft: an artifact that does not install is not a
    # release, and finding that out after publishing is worse than a slower workflow.
    needs: [package, test-packages, test-aur-package]
    runs-on: ubuntu-latest
    # Only a real tag push publishes anything; workflow_dispatch stops after building,
    # which is what makes it usable as a dry run.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write         # required to create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true         # review the artifacts, then publish by hand
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Downloads

            Every download below contains **both** the standalone application and the
            LV2 plugin.

            | Platform | Download |
            | --- | --- |
            | Debian / Ubuntu | `luvie_*.deb` |
            | Fedora / openSUSE | `luvie-*.x86_64.rpm` |
            | Arch Linux | [`luvie`](https://aur.archlinux.org/packages/luvie) in the AUR |
            | macOS | `Luvie-*-macos-universal.dmg` |
            | Windows | `luvie-*-windows-x86_64-setup.exe`, or the `.zip` |

            On another Linux distribution, build from source — see
            [BUILD](https://github.com/benbriedis/luvie/blob/main/BUILD).

            The `.deb`, `.rpm` and the Windows installer put both halves in place for you.
            From the `.zip`, copy `luvie.lv2` into `%APPDATA%\LV2` yourself.

            ### Luvie is not code-signed

            Signing certificates cost money on both platforms — an Apple Developer
            subscription for macOS, annually — so both operating systems will question these
            downloads. Nothing is wrong with them; here is what to do.

            **Windows.** SmartScreen says "Windows protected your PC": click **More info**,
            then **Run anyway**. You get the same warning from the installer and from the
            `.exe` in the zip. To skip it entirely, install through
            [Scoop](https://scoop.sh) instead:

            ```
            scoop bucket add luvie https://github.com/benbriedis/scoop-luvie
            scoop install luvie
            ```

            **macOS.** Open the `.dmg` and read `README.txt` — it has both steps. In short:

            - **The plugin needs one command**, or your DAW will not list it and will not say
              why:
              `xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/LV2/luvie.lv2`
            - **The app**: on first launch macOS refuses, then offers **Open Anyway** under
              System Settings → Privacy & Security. (Right-click → Open no longer works on
              macOS 15 and later.)

            JACK is optional everywhere: Luvie loads it at runtime if present and
            falls back to its internal transport and native MIDI output if not.
