# Build and smoke-test Luvie on all three supported platforms.
#
# This workflow proves the tree still compiles and starts; release.yml does the packaging.
# The two share their setup steps by copy rather than through a reusable workflow — the
# duplication is a dozen lines and keeps each file readable on its own.

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']      # tag pushes are release.yml's job, not a duplicate CI run
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform breaking shouldn't hide the others' results
      matrix:
        include:
          # Ubuntu 22.04 rather than latest: this is also the release build host, and its
          # older glibc is what makes the AppImage usable on more than the newest distros.
          - name: Linux
            os: ubuntu-22.04
            preset: linux-dist
            binary: build-dist/src/luvie
          - name: macOS
            os: macos-14
            preset: macos-dist
            # A macOS build produces an application bundle, not a bare executable.
            binary: build-dist/src/Luvie.app
          - name: Windows
            os: windows-latest
            preset: windows-dist
            binary: build-dist/src/luvie.exe

    defaults:
      run:
        # MSYS2 provides the UCRT64 GCC toolchain; the other two use their default shell.
        # `msys2 {0}` is a no-op unless the step declares otherwise, so it is set per-job.
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # cmake/GitVersion.cmake and cmake/ProjectVersion.cmake both run
          # `git describe --tags`. The default shallow, tagless checkout would reduce
          # every build's version to a bare commit hash.
          fetch-depth: 0

      # ---- Toolchain -------------------------------------------------------------
      - name: Install Linux dependencies
        if: matrix.name == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          # g++-13 is not in jammy's default archive.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          # No libjack-jackd2-dev: the JACK headers are fetched by CMake and the library
          # is dlopen'd, so JACK is not a build dependency at all any more.
          # xvfb is for the smoke test — the runner has no display.
          sudo apt-get install -y --no-install-recommends \
            g++-13 ninja-build pkg-config xvfb \
            libasound2-dev \
            libx11-dev libxkbcommon-dev libxinerama-dev libxcursor-dev libxfixes-dev \
            libxft-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev libdbus-1-dev \
            libgtk-3-dev
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: matrix.name == 'macOS'
        shell: bash
        # Xcode's clang already covers C++23, FLTK's Cocoa backend needs no extra
        # libraries, and liblo and the JACK headers are both fetched by CMake.
        run: brew install ninja

      - name: Set up MSYS2
        if: matrix.name == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      # ---- Dependency cache ------------------------------------------------------
      # FLTK is pinned to a commit, so FetchContent clones it in full (no GIT_SHALLOW),
      # then builds it static. That dominates a cold build; caching the populated _deps
      # tree turns a ~10 minute configure into seconds. Keyed on the file that holds
      # every pinned revision, so a version bump invalidates it automatically.
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build-dist/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}

      # ---- Build and test --------------------------------------------------------
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The smoke test starts the real application, shows its window and quits through
      # the normal teardown path. Linux runners are headless, hence xvfb; macOS and
      # Windows runners have an interactive desktop session.
      - name: Test (Linux)
        if: matrix.name == 'Linux'
        shell: bash
        run: xvfb-run -a ctest --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.name != 'Linux'
        run: ctest --preset ${{ matrix.preset }}

      # ---- Artifacts -------------------------------------------------------------
      # Unpackaged, for grabbing a build off a branch. release.yml produces the real
      # archives.
      #
      # Staged into a directory first rather than uploaded straight out of the build
      # tree: upload-artifact roots the archive at the common ancestor of the paths it
      # matches, so build-dist/src/luvie would arrive under a src/ directory that means
      # nothing to whoever downloads it. Staging names the layout instead.
      - name: Stage artifact
        run: |
          set -eu
          mkdir -p artifact/standalone
          cp -R "${{ matrix.binary }}" artifact/standalone/
          cp -R build-dist/luvie.lv2 build-dist/LICENSES artifact/

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: luvie-${{ matrix.name }}
          if-no-files-found: error
          path: artifact
